name: Deploy New Way's Website

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps: 
      

      - name: Live website only from the main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then echo "STOP: the live website is only ever deployed from the main branch (this is ${GITHUB_REF_NAME}). For the test copy, use Deploy STAGING (test copy)."; exit 1; fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply new-ways --remote

      - name: Deploy website
        run: npx wrangler deploy
